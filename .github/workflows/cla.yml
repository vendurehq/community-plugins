name: CLA

# Checks that everyone who has to sign the Contributor License Agreement for a pull request has
# signed it. Uses the shared workflow from vendurehq/vendure, which stores the signatures of all
# Vendure repositories in one file. See that workflow for the rules.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  cla:
    uses: vendurehq/vendure/.github/workflows/cla_check.yml@master
    # The token for the signatures file, the status and the comment comes from the CI bot app.
    # This permission is only for checking out the workflow's own scripts.
    permissions:
      contents: read
    secrets: inherit
